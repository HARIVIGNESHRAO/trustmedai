spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=email,profile
# Microsoft OAuth

spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET}

spring.security.oauth2.client.registration.microsoft.scope=openid,profile

spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.microsoft.issuer-uri=https://login.microsoftonline.com/4362e394-967c-44c3-b92b-988613c8e714/v2.0
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Enable Prometheus Endpoint
management.endpoint.prometheus.access=unrestricted

# Show application details
management.info.env.enabled=true

# Optional (shows more health information)
management.endpoint.health.show-details=always

# Hyperledger Fabric is opt-in. Enable it only after fabric-network/start-local-network.sh succeeds.
fabric.enabled=${FABRIC_ENABLED:false}
fabric.network-path=${FABRIC_NETWORK_PATH:../fabric-network/fabric-samples/test-network}
fabric.msp-id=${FABRIC_MSP_ID:Org1MSP}
fabric.channel=${FABRIC_CHANNEL:mychannel}
fabric.chaincode=${FABRIC_CHAINCODE:reportproof}
fabric.peer-endpoint=${FABRIC_PEER_ENDPOINT:localhost:7051}
fabric.peer-hostname=${FABRIC_PEER_HOSTNAME:peer0.org1.example.com}
fabric.model-version=${FABRIC_MODEL_VERSION:trustmedai-models-1.0}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.springframework.mail=${MAIL_LOG_LEVEL:INFO}
logging.level.com.sun.mail=${MAIL_LOG_LEVEL:INFO}
# Cloudflare Turnstile
cloudflare.turnstile.secret-key=${TURNSTILE_SECRET_KEY}
cloudflare.turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
